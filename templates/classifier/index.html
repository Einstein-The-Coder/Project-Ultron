<!DOCTYPE html>

<html>

<head>

    <title>Digit Classifier</title>

    {% load static %}

    <link
        rel="stylesheet"
        href="{% static 'classifier/style.css' %}"
    >

</head>

<body>

    <div class="container">

        <h1>PyTorch Digit Classifier</h1>

        <p>Draw a digit:</p>

        <canvas
            id="canvas"
            width="280"
            height="280"
        ></canvas>

        <div>

            <button id="predict">
                Predict
            </button>

            <button id="clear">
                Clear
            </button>

        </div>

        <div id="result">
            Prediction: -
        </div>

    </div>

    <script src="{% static 'classifier/app.js' %}"></script>

</body>

</html>
